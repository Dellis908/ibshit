# nginx site configuration for the IB Biology revision app.
#
# Install to /etc/nginx/sites-available/ibshit, symlink into sites-enabled,
# edit server_name, then: sudo nginx -t && sudo systemctl reload nginx
#
# After DNS points at the server, add TLS with:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d bio.example.com

upstream ibshit_app {
    # Matches RuntimeDirectory=ibshit in the systemd unit.
    server unix:/run/ibshit/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name bio.example.com;

    # Request logging
    access_log /var/log/nginx/ibshit.access.log;
    error_log  /var/log/nginx/ibshit.error.log;

    # Question banks get imported as JSON bodies.
    client_max_body_size 25m;

    # Serve static assets directly; they never change per request.
    location /static/ {
        alias /srv/ibshit/app/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # proxy_params ships with Debian's nginx and sets the standard headers.
        include proxy_params;
        proxy_pass http://ibshit_app;
        proxy_redirect off;

        # Pass the real client information through to the app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mirrored question images can take a moment on first fetch.
        proxy_read_timeout 75s;
        proxy_connect_timeout 15s;
    }

    # Health check endpoint, useful for uptime monitoring.
    location = /healthz {
        include proxy_params;
        proxy_pass http://ibshit_app;
        access_log off;
    }
}
